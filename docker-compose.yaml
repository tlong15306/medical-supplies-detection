services:
  api:
    image: golang:1.26-bookworm
    working_dir: /app
    command: ["go", "run", "./cmd/api"]

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./backend:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build

volumes:
  go-mod-cache:
  go-build-cache: